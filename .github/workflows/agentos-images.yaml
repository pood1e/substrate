name: AgentOS images

on:
  push:
    branches: ['agentos/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentos-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: substrate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: substrate-ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d substrate" --health-interval 2s --health-retries 15
    env:
      SUBSTRATE_TEST_POSTGRES_URL: postgresql://postgres:substrate-ci@localhost:5432/substrate?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: psql "$SUBSTRATE_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - name: Test the AgentOS backports
        run: |
          go test -race -count=1 ./cmd/ateapi/internal/apivalidation ./cmd/ateapi/internal/defaults \
            ./cmd/ateapi/internal/controlapi ./internal/ateworker/tunnel ./internal/atunnel/egress \
            ./cmd/atenet/internal/router/egress ./internal/serverboot
          # Network namespace tests need a privileged KVM host.
          go test -race -count=1 ./cmd/ateworker-microvm \
            -skip '^(TestHostActorReplacesSameActor|TestSetupActorTap|TestSetupActorTapReplacesALeftover)$'
          go test -race -count=1 ./cmd/ateapi/internal/store/atepg \
            -run 'TestContractSuite|TestCreateActor|TestUpdateActor'
      - name: Build binaries
        run: |
          for component in ateapi ateworker-microvm; do
            mkdir -p "dist/$component"
            CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w' \
              -o "dist/$component/$component" "./cmd/$component"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 1

  images:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [ateapi, ateworker-microvm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries
          path: dist/
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: dist/${{ matrix.component }}
          file: agentos/images/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Verify the published entrypoint
        run: docker run --rm "${REGISTRY}/${{ matrix.component }}@${{ steps.build.outputs.digest }}" --help
      - run: echo "${REGISTRY}/${{ matrix.component }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
